<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rekenladder</title>
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://rekenladder.nl/" />
    <link rel="canonical" href="https://rekenladder.nl/" />
    <style>
      :root {
        color-scheme: light;
        font-family: ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #17283a;
        background: #f3f8fb;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 440px);
        padding: 32px;
        text-align: center;
        background: #fff;
        border: 1px solid #dce7ee;
        border-radius: 18px;
        box-shadow: 0 10px 24px rgb(23 40 58 / 0.06);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        color: #15508c;
      }
      p {
        margin: 0 0 24px;
        font-size: 18px;
        line-height: 1.5;
      }
      a {
        color: #15508c;
      }
      .knop {
        display: inline-block;
        padding: 14px 22px;
        border-radius: 18px;
        background: #15508c;
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rekenladder</h1>
      <p>De app staat nu op <a href="https://rekenladder.nl/">rekenladder.nl</a>.</p>
      <p><a class="knop" href="https://rekenladder.nl/">Naar Rekenladder</a></p>
    </main>
  </body>
</html>
