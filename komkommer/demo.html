<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komkommer</title>
<meta name="description" content="Een studietimer met een komkommer: 45 minuten werken, 15 minuten pauze.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --ink: #17232b;
    --paper: #eaf6fc;
    --pale: #cdeaf7;
    --mid: #96d3ee;
    --blue: #1e8bbc;
    --white: #fafdff;
    --line: #17232b2e;
    --green: #4f9a3c;
    --green-pale: #d7efc9;
    --font-schoolbook: "Century Schoolbook", "Century Schoolbook L", "New Century Schoolbook", "TeX Gyre Schola", Georgia, serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-schoolbook);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    transition: background-color .6s ease;
  }

  body.pauze { background: #eef8e8; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 16px 8px;
  }

  .wissel {
    display: inline-flex;
    padding: 3px;
    margin-top: 4px;
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .wissel button {
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .16em;
    padding: 8px 18px;
    border: 0;
    border-radius: 999px;
    background: none;
    color: var(--ink);
    opacity: .5;
    cursor: pointer;
    transition: background-color .3s, color .3s, opacity .3s;
  }
  .wissel button:hover { opacity: .8; }
  .wissel button[aria-pressed="true"] { opacity: 1; background: var(--blue); color: var(--white); }
  body.pauze .wissel button[aria-pressed="true"] { background: var(--green); }
  .wissel button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .time {
    font-size: clamp(88px, 17vw, 168px);
    letter-spacing: -.05em;
    line-height: 1;
    margin: 6px 0 28px;
    font-variant-numeric: tabular-nums;
  }

  .bediening {
    display: grid;
    grid-template-columns: 48px 76px 48px;
    gap: 18px;
    align-items: center;
  }
  .rond {
    display: grid;
    place-items: center;
    border-radius: 50%;
    cursor: pointer;
    padding: 0;
    transition: background-color .2s, opacity .2s;
  }
  .hoofd {
    grid-column: 2;
    width: 76px;
    height: 76px;
    border: 0;
    background: var(--blue);
    color: var(--white);
  }
  .hoofd:hover { background: #17739c; }
  body.pauze .hoofd { background: var(--green); }
  body.pauze .hoofd:hover { background: #3f7f2f; }
  .hoofd .i-pauzeer { display: none; }
  body.running .hoofd .i-start { display: none; }
  body.running .hoofd .i-pauzeer { display: block; }
  .terug {
    width: 48px;
    height: 48px;
    border: 1px solid var(--line);
    background: none;
    color: var(--ink);
    opacity: .6;
  }
  .terug:hover { opacity: 1; }

  .rond:focus-visible, .toggle input:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 3px;
  }

  .illustration {
    display: flex;
    justify-content: center;
    margin-bottom: clamp(20px, 6vh, 56px);
  }
  .illustration svg {
    width: min(500px, 100%);
    height: auto;
    overflow: visible;
  }
  #schaaf { transform: translate(0px, -64px) rotate(-16deg); }
  #schaaf-pos { transition: opacity .5s; }
  body.pauze #schaaf-pos { opacity: 0; }
  body.running:not(.pauze) .kk-dobber { animation: dobber 3s ease-in-out infinite; }
  body.running:not(.pauze) .schaaf-zweef { animation: zweef 2.4s ease-in-out infinite; }
  @keyframes dobber { 50% { transform: translateY(-4px); } }
  @keyframes zweef { 50% { transform: translateY(-7px); } }
  #stapel > g { transition: opacity .4s; }

  .onder {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 6px 22px;
    padding: 16px 16px 22px;
    font-size: 14px;
    color: color-mix(in srgb, var(--ink) 60%, transparent);
  }
  .groep { display: flex; align-items: center; gap: 4px; }
  .icoon {
    display: inline-flex;
    padding: 4px;
    background: none;
    border: 0;
    color: inherit;
    cursor: pointer;
    border-radius: 50%;
  }
  .icoon:hover { color: var(--ink); }
  .icoon:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  .melding {
    position: relative;
    margin: 0;
    padding: 11px 48px;
    border-bottom: 1px solid var(--line);
    background: var(--white);
    font-size: 14px;
    line-height: 1.45;
    text-align: center;
  }
  .melding[hidden] { display: none; }
  .melding .sluit {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    font: inherit;
    font-size: 22px;
    line-height: 1;
    background: none;
    border: 0;
    color: var(--ink);
    opacity: .5;
    cursor: pointer;
  }
  .toggle {
    display: flex;
    gap: 7px;
    align-items: center;
    cursor: pointer;
  }
  .toggle input { accent-color: var(--blue); width: 15px; height: 15px; margin: 0; }

  @media (max-width: 760px) {
    .illustration svg { width: min(340px, 92%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .kk-dobber, .schaaf-zweef { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="melding" id="iosmelding" role="note" hidden>
    Op een iPhone klinkt het belletje alleen als deze pagina open en in beeld blijft (het scherm blijft vanzelf aan) en je iPhone niet op stil staat.
    <button type="button" class="sluit" id="iosmelding-sluit" aria-label="Melding sluiten">×</button>
  </div>

  <main>
    <div class="illustration" aria-hidden="true">
          <svg viewBox="0 -10 480 340" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="kk-rest"><rect id="kk-rest-rect" x="0" y="0" width="520" height="400"/></clipPath>
            </defs>
            <!-- schaduw -->
            <ellipse id="kk-schaduw" cx="243" cy="226" rx="197" ry="7" fill="#17232b" opacity=".07"/>
            <g id="stapel"></g>
            <g id="kk-wrap">
              <g class="kk-dobber">
                <g id="kk" clip-path="url(#kk-rest)">
                  <!-- de vorm wordt in het script uit een dikteprofiel berekend -->
                  <path id="kk-donker" fill="#4f9136"/>
                  <path id="kk-licht" fill="#7fbb5c"/>
                  <g id="kk-ribbels" fill="#62a346" opacity=".7"></g>
                  <path id="kk-dak" fill="none" stroke="#2f6b22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle id="kk-nopje" r="3" fill="#a9c94b"/>
                  <path id="kk-steel" fill="#2f6b22"/>
                </g>
                <g id="snijvlak"></g>
              </g>
            </g>
            <!-- kaasschaaf -->
            <g id="schaaf-pos" transform="translate(70 172)">
              <g class="schaaf-zweef">
                <g id="schaaf">
                  <!-- steel, met de gleuf vlak onder de hals en het blad dat naar het eind smaller wordt -->
                  <path d="M-3.5 -14 C-5 -40 -5.5 -70 -4 -92 Q0 -97 4 -92 C5.5 -70 5 -40 3.5 -14 Z" fill="#1e8bbc"/>
                  <path d="M-11.5 37 H11.5 Q14.5 37 15 34 L23 0 Q24 -4 20 -7 Q10 -12 5 -15 H-5 Q-10 -12 -20 -7 Q-24 -4 -23 0 L-15 34 Q-14.5 37 -11.5 37 Z" fill="#cdeaf7" stroke="#1e8bbc" stroke-width="2.5" stroke-linejoin="round"/>
                  <path d="M-5 -20 H5 L4 -12 H-4 Z" fill="#1e8bbc"/>
                  <rect x="-19" y="-1.5" width="38" height="3" rx="1.5" fill="#1e8bbc"/>
                </g>
              </g>
            </g>
            <g id="vallers"></g>
          </svg>
    </div>
    <div class="wissel" role="group" aria-label="Werken of pauze">
      <button type="button" data-phase="werk" aria-pressed="true">werken</button>
      <button type="button" data-phase="pauze" aria-pressed="false">pauze</button>
    </div>
    <div class="time" id="time" aria-live="off">45:00</div>
    <div class="bediening">
      <button type="button" class="rond hoofd" id="start" aria-label="Start" title="Start">
        <svg class="i-start" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>
        <svg class="i-pauzeer" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2" fill="currentColor"/></svg>
      </button>
      <button type="button" class="rond terug" id="reset" aria-label="Opnieuw" title="Opnieuw">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4.5h4.5"/></svg>
      </button>
    </div>
  </main>

  <footer class="onder">
    <span class="groep">
      <label class="toggle"><input type="checkbox" id="sound" checked><span>geluid</span></label>
      <button type="button" class="icoon" id="testgeluid" aria-label="Geluid proberen" title="Geluid proberen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/>
          <path d="M15.5 9a4 4 0 0 1 0 6"/>
          <path d="M18 6.5a7.5 7.5 0 0 1 0 11"/>
        </svg>
      </button>
    </span>
    <label class="toggle" title="Na het werken start de pauze vanzelf, en na de pauze weer het werken"><input type="checkbox" id="auto"><span>automatisch doorlopen</span></label>
  </footer>

<script>
  // ?tempo=30 laat de tijd 30 keer zo snel lopen, handig om te testen.
  const TEMPO = Math.max(1, Number(new URLSearchParams(location.search).get('tempo')) || 1);
  const MINUUT = 60 / TEMPO;
  const DUUR = { werk: 45 * MINUUT, pauze: 15 * MINUUT };

  const $ = (id) => document.getElementById(id);
  const els = {
    time: $('time'),
    start: $('start'), reset: $('reset'),
    sound: $('sound'), auto: $('auto')
  };

  let fase = 'werk';
  let resterend = DUUR.werk;   // seconden, als de timer stilstaat
  let eindtijd = null;         // ms-tijdstempel, als de timer loopt
  let tikker = null;
  let audio = null;

  function opslagLezen(sleutel, standaard) {
    try { const v = localStorage.getItem(sleutel); return v === null ? standaard : JSON.parse(v); }
    catch { return standaard; }
  }
  function opslagSchrijven(sleutel, waarde) {
    try { localStorage.setItem(sleutel, JSON.stringify(waarde)); } catch {}
  }


  function formatteer(s) {
    s = Math.max(0, Math.ceil(s));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function over() {
    return eindtijd ? (eindtijd - Date.now()) / 1000 : resterend;
  }

  // De komkommer: 45 plakjes, één per werkminuut.
  const NS = 'http://www.w3.org/2000/svg';
  const KK = { x0: 56, x1: 430, r: 24, cy: 160, krom: 20, n: 45 };
  const SCHIJF = 22;   // straal van een plakje op het bordje
  const STAP = (KK.x1 - KK.x0) / KK.n;
  const rustig = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const svg = {
    wrap: $('kk-wrap'), kk: $('kk'), rest: $('kk-rest-rect'), snijvlak: $('snijvlak'),
    schaduw: $('kk-schaduw'), schaafPos: $('schaaf-pos'), schaaf: $('schaaf'),
    stapel: $('stapel'), vallers: $('vallers')
  };
  let gesneden = 0;     // plakjes van de huidige komkommer af
  let stapel = 0;       // plakjes op het bordje
  let pauzeStart = 0;   // plakjes op het bordje aan het begin van de pauze
  let lopend = [];
  let wachters = [];

  function snijX(n) { return KK.x0 + n * STAP; }

  // Halve hoogte van de komkommer op plek x (de uiteinden zijn rond).
  // Kaskomkommer: links de puntige bloemkant, rechts de smallere steelkant, licht krom.
  function straal(x) {
    const t = Math.min(1, Math.max(0, (x - KK.x0) / (KK.x1 - KK.x0)));
    if (t < 0.2) return KK.r * (1 - Math.pow(1 - t / 0.2, 2));
    if (t < 0.72) return KK.r;
    let r = KK.r * (1 - 0.3 * Math.pow((t - 0.72) / 0.28, 1.3));
    if (t > 0.96) r *= Math.sqrt(Math.max(0, 1 - Math.pow((t - 0.96) / 0.04, 2)));
    return r;
  }

  function midden(x) {
    const u = 2 * (x - KK.x0) / (KK.x1 - KK.x0) - 1;
    return KK.cy + KK.krom * (1 - u * u);
  }

  function hoogte(x) { return Math.max(4, straal(x)); }

  function lijn(punten) {
    return punten.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  }

  function bouwKomkommer() {
    const N = 140, xs = [];
    for (let i = 0; i <= N; i++) xs.push(KK.x0 + (KK.x1 - KK.x0) * i / N);
    const boven = xs.map(x => [x, midden(x) - straal(x)]);
    const onder = xs.map(x => [x, midden(x) + straal(x)]);
    const binnen = xs.map(x => [x, midden(x) + 0.4 * straal(x)]);
    $('kk-donker').setAttribute('d', lijn(boven.concat(onder.slice().reverse())) + ' Z');
    $('kk-licht').setAttribute('d', lijn(onder.concat(binnen.slice().reverse())) + ' Z');
    $('kk-dak').setAttribute('d', lijn(boven.filter(p => p[0] > KK.x0 + 10 && p[0] < KK.x1 - 6)));
    // Ribbeltjes: korte streepjes die de kromming volgen.
    let ribbels = '';
    for (let i = 0; i < 30; i++) {
      const x = KK.x0 + 40 + ((i * 53) % 97) / 97 * (KK.x1 - KK.x0 - 70);
      const v = ((i * 31) % 17) / 17 * 1.1 - 0.7;
      ribbels += `<ellipse cx="${x.toFixed(1)}" cy="${(midden(x) + v * straal(x)).toFixed(1)}" rx="${(2.5 + (i % 3)).toFixed(1)}" ry=".8"/>`;
    }
    $('kk-ribbels').innerHTML = ribbels;
    const nop = $('kk-nopje');
    nop.setAttribute('cx', KK.x0 - 1);
    nop.setAttribute('cy', midden(KK.x0));
    const sy = midden(KK.x1);
    $('kk-steel').setAttribute('d', `M${KK.x1 - 3} ${sy - 4} L${KK.x1 + 12} ${sy - 5} L${KK.x1 + 12} ${sy + 3} L${KK.x1 - 3} ${sy + 4} Z`);
  }

  function maakPlakje() {
    const g = document.createElementNS(NS, 'g');
    g.innerHTML = '<ellipse rx="22" ry="6" fill="#2f6b22"/>' +
      '<ellipse cy="-1" rx="19.5" ry="4.6" fill="#eef8e2"/>' +
      '<ellipse cy="-1" rx="10" ry="2.3" fill="#d3ecbc"/>';
    return g;
  }

  function stapelPlek(i) {
    return [120 + ((i * 37) % 11 - 5) * 1.3, 296 - i * 1.8];
  }

  for (let i = 0; i < KK.n; i++) {
    const p = maakPlakje();
    const [x, y] = stapelPlek(i);
    p.setAttribute('transform', `translate(${x} ${y})`);
    p.style.opacity = 0;
    svg.stapel.append(p);
  }
  svg.snijvlak.append(maakPlakje());

  function zetKomkommer(n) {
    const x = snijX(n);
    const op = n >= KK.n;
    svg.rest.setAttribute('x', x);
    svg.kk.style.visibility = op ? 'hidden' : '';
    svg.snijvlak.style.visibility = n > 0 && !op ? '' : 'hidden';
    svg.snijvlak.setAttribute('transform', `translate(${x} ${midden(x)}) rotate(90) scale(${hoogte(x) / SCHIJF})`);
    svg.schaduw.style.visibility = op ? 'hidden' : '';
    svg.schaduw.setAttribute('cx', (x + KK.x1) / 2);
    svg.schaduw.setAttribute('rx', (KK.x1 - x) / 2 + 12);
    svg.schaafPos.setAttribute('transform', `translate(${x} ${midden(x)})`);
  }

  function zetStapel(k) {
    stapel = k;
    [...svg.stapel.children].forEach((p, i) => { p.style.opacity = i < k ? 1 : 0; });
  }

  function stopAnimaties() {
    lopend.forEach(a => a.cancel());
    wachters.forEach(clearTimeout);
    lopend = [];
    wachters = [];
    svg.vallers.replaceChildren();
  }

  // Eén haal van de kaasschaaf als vloeiende kromme: links langs het snijvlak omlaag,
  // in een boog onder de komkommer door en dan met de steel voorop omhoog.
  // Eén versnelling en afremming over de hele baan, zodat hij nergens stokt.
  const HAAL = (() => {
    const P = [[0, -64], [-26, -52], [-46, -18], [-46, 26], [-30, 56], [-6, 60], [0, 36], [0, 0], [0, -36], [0, -64]];
    const cr = (a, b, c, d, t) => [0, 1].map(k => 0.5 * (2 * b[k] + (c[k] - a[k]) * t +
      (2 * a[k] - 5 * b[k] + 4 * c[k] - d[k]) * t * t + (3 * b[k] - a[k] - 3 * c[k] + d[k]) * t * t * t));
    const punten = [];
    for (let i = 0; i < P.length - 1; i++) {
      const a = P[Math.max(0, i - 1)], d = P[Math.min(P.length - 1, i + 2)];
      for (let k = 0; k < 24; k++) punten.push(cr(a, P[i], P[i + 1], d, k / 24));
    }
    punten.push(P[P.length - 1]);
    // Afgelegde afstand per punt, zodat de snelheid langs de baan gelijkmatig is.
    const lengte = [0];
    for (let i = 1; i < punten.length; i++) {
      lengte.push(lengte[i - 1] + Math.hypot(punten[i][0] - punten[i - 1][0], punten[i][1] - punten[i - 1][1]));
    }
    const totaal = lengte[lengte.length - 1];
    const op = (s) => {
      const d = s * totaal;
      let j = 1;
      while (j < lengte.length - 1 && lengte[j] < d) j++;
      const f = (d - lengte[j - 1]) / ((lengte[j] - lengte[j - 1]) || 1);
      return [0, 1].map(k => punten[j - 1][k] + f * (punten[j][k] - punten[j - 1][k]));
    };
    const zacht = (u) => 0.5 - 0.5 * Math.cos(Math.PI * u);
    const stappen = [];
    for (let i = 0; i <= 72; i++) {
      const s = zacht(i / 72);
      const [x, y] = op(s);
      const r = -16 + 12 * Math.sin(Math.PI * s);
      stappen.push({ x, y, r, s });
    }
    // Het moment waarop de gleuf op de terugweg omhoog het midden passeert.
    let snij = 0.7;
    for (let i = 1; i <= 1000; i++) {
      const s0 = zacht((i - 1) / 1000), s1 = zacht(i / 1000);
      if (s1 > 0.6 && op(s0)[1] > 0 && op(s1)[1] <= 0) { snij = i / 1000; break; }
    }
    // De schaaf rust boven het vorige plakje en schuift tijdens het omlaag gaan
    // geleidelijk op naar het nieuwe, zodat hij bij de start niet verspringt.
    const frames = (dx, dy) => stappen.map(({ x, y, r, s }) => {
      const v = Math.min(1, s / 0.4);
      const rest = 1 - v * v * (3 - 2 * v);
      return { transform: `translate(${(x + dx * rest).toFixed(2)}px, ${(y + dy * rest).toFixed(2)}px) rotate(${r.toFixed(2)}deg)` };
    });
    // Normaal 2,4 s; bij een versnelde test korter, zodat een haal nooit over de volgende heen valt.
    return { frames, snij, duur: Math.min(2400, MINUUT * 1000 * 0.85) };
  })();

  function schaafAf(n) {
    const oud = snijX(gesneden), nieuw = snijX(n);
    const plek = n - 1;
    gesneden = n;
    svg.schaafPos.setAttribute('transform', `translate(${nieuw} ${midden(nieuw)})`);
    lopend.push(svg.schaaf.animate(HAAL.frames(oud - nieuw, midden(oud) - midden(nieuw)), { duration: HAAL.duur }));

    // Halverwege de haal valt het plakje eraf en tuimelt naar het bordje.
    wachters.push(setTimeout(() => {
      zetKomkommer(n);
      const mx = (oud + nieuw) / 2, my = midden(mx);
      const [px, py] = stapelPlek(plek);
      const p = maakPlakje();
      svg.vallers.append(p);
      const val = p.animate([
        { transform: `translate(${mx}px, ${my}px) rotate(90deg) scale(${hoogte(mx) / SCHIJF})` },
        { transform: `translate(${mx - 16}px, ${my - 34}px) rotate(-40deg) scale(.95)`, offset: .25 },
        { transform: `translate(${px}px, ${py}px) rotate(-360deg) scale(1)` }
      ], { duration: 1100, easing: 'cubic-bezier(.3, 0, .8, .6)' });
      lopend.push(val);
      val.onfinish = () => { p.remove(); zetStapel(Math.max(stapel, plek + 1)); };
    }, HAAL.duur * HAAL.snij));
  }

  function nieuweKomkommer(animeer) {
    stopAnimaties();
    const hadIets = gesneden > 0;
    gesneden = 0;
    zetKomkommer(0);
    zetStapel(0);
    if (animeer && hadIets && !rustig) {
      lopend.push(svg.wrap.animate(
        [{ transform: 'translate(480px, 0px)' }, { transform: 'translate(0px, 0px)' }],
        { duration: 900, easing: 'cubic-bezier(.2, .8, .2, 1)' }
      ));
    }
  }

  function syncKomkommer(s, animeer) {
    if (fase === 'werk') {
      const doel = Math.min(KK.n, Math.max(0, Math.floor((DUUR.werk - s) / MINUUT + 1e-6)));
      if (doel === gesneden) return;
      if (animeer && doel === gesneden + 1 && !document.hidden && !rustig) schaafAf(doel);
      else { stopAnimaties(); gesneden = doel; zetKomkommer(doel); zetStapel(doel); }
    } else {
      if (svg.vallers.childElementCount) return;
      const doel = Math.min(pauzeStart, Math.ceil(pauzeStart * s / DUUR.pauze - 1e-6));
      if (doel !== stapel) zetStapel(doel);
    }
  }

  function teken() {
    const s = over();
    syncKomkommer(s, !!eindtijd);
    const tijd = formatteer(s * TEMPO);
    els.time.textContent = tijd;
    document.title = (eindtijd ? tijd + ' · ' : '') + (fase === 'werk' ? 'Werken' : 'Pauze') + ' · Komkommer';
  }

  function zetFase(nieuw, animeer = true) {
    fase = nieuw;
    if (fase === 'werk') nieuweKomkommer(animeer);
    else pauzeStart = gesneden;
    document.body.classList.toggle('pauze', fase === 'pauze');
    document.querySelectorAll('.wissel button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.phase === fase)));
    resterend = DUUR[fase];
    teken();
    bewaar();
  }

  // De stand bewaren, zodat de timer doorloopt als de telefoon de pagina opnieuw laadt.
  function bewaar() {
    opslagSchrijven('komkommer-stand', { fase, eindtijd, resterend, pauzeStart });
  }

  function start() {
    zorgVoorAudio();
    eindtijd = Date.now() + resterend * 1000;
    loopAan();
    bewaar();
  }

  // De hoofdknop toont alleen een icoon; het label is voor schermlezers en de tooltip.
  function knop(label) {
    els.start.setAttribute('aria-label', label);
    els.start.title = label;
  }

  function loopAan() {
    document.body.classList.add('running');
    knop('Pauzeer');
    clearInterval(tikker);
    tikker = setInterval(tik, 250);
    houdSchermAan();
    teken();
  }

  function stop() {
    if (eindtijd) resterend = Math.max(0, over());
    eindtijd = null;
    clearInterval(tikker);
    document.body.classList.remove('running');
    laatSchermLos();
    knop(resterend < DUUR[fase] ? 'Verder' : 'Start');
    teken();
    bewaar();
  }

  function tik() {
    if (over() <= 0) klaar();
    else teken();
  }

  function klaar() {
    const was = fase;
    eindtijd = null;
    clearInterval(tikker);
    if (was === 'werk') syncKomkommer(0, true);
    alarm(was);
    zetFase(was === 'werk' ? 'pauze' : 'werk');
    if (els.auto.checked) start();
    else stop();
  }

  // Geluid: een klein belletje via Web Audio, geen bestanden nodig.
  function zorgVoorAudio() {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audio = new AC();
    }
    if (audio && audio.state === 'suspended') audio.resume();
  }

  function toon(freq, begin, duur) {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, begin);
    gain.gain.exponentialRampToValueAtTime(0.35, begin + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, begin + duur);
    osc.connect(gain).connect(audio.destination);
    osc.start(begin);
    osc.stop(begin + duur + 0.05);
  }

  function belletje(was) {
    // Mag er (nog) geen geluid, dan klinkt het belletje bij de eerste tik op het scherm.
    if (!audio) {
      document.addEventListener('pointerdown', () => { zorgVoorAudio(); belletje(was); }, { once: true });
      return;
    }
    const speel = () => {
      const t = audio.currentTime + 0.05;
      // Werk klaar: vrolijk omhoog. Pauze klaar: terug naar beneden, aan het werk.
      const noten = was === 'werk' ? [660, 880, 1320] : [1320, 880, 660];
      for (let herhaal = 0; herhaal < 3; herhaal++) {
        noten.forEach((f, i) => toon(f, t + herhaal * 1.1 + i * 0.18, 0.6));
      }
    };
    // Een telefoon kan het geluid na een tijdje stil zetten; eerst weer wekken.
    let gespeeld = false;
    const eenmaal = () => { if (!gespeeld) { gespeeld = true; speel(); } };
    if (audio.state === 'running') return eenmaal();
    audio.resume().then(eenmaal, () => {});
    document.addEventListener('pointerdown', () => audio.resume().then(eenmaal, () => {}), { once: true });
  }

  // Scherm aan houden zolang de timer loopt: een slapende telefoon bevriest de pagina en mist het alarm.
  let schermslot = null;
  async function houdSchermAan() {
    if (!('wakeLock' in navigator) || schermslot || !eindtijd || document.hidden) return;
    try {
      schermslot = await navigator.wakeLock.request('screen');
      schermslot.addEventListener('release', () => { schermslot = null; });
    } catch {}
  }
  function laatSchermLos() {
    if (schermslot) schermslot.release().catch(() => {});
    schermslot = null;
  }

  function alarm(was) {
    if (els.sound.checked) belletje(was);
  }

  $('testgeluid').addEventListener('click', () => { zorgVoorAudio(); belletje('werk'); });
  els.start.addEventListener('click', () => (eindtijd ? stop() : start()));
  els.reset.addEventListener('click', () => { stop(); zetFase(fase); knop('Start'); });
  document.querySelectorAll('.wissel button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.phase === fase) return;
    stop();
    zetFase(b.dataset.phase);
    knop('Start');
  }));

  ['sound', 'auto'].forEach(k => els[k].addEventListener('change', () => opslagSchrijven('komkommer-' + k, els[k].checked)));

  // Spatiebalk start en pauzeert.
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !['INPUT', 'BUTTON'].includes(document.activeElement.tagName)) {
      e.preventDefault();
      els.start.click();
    }
  });

  // Als het tabblad terugkomt uit de achtergrond, meteen bijwerken.
  document.addEventListener('visibilitychange', () => {
    if (!eindtijd) return;
    tik();
    houdSchermAan();
  });

  els.sound.checked = opslagLezen('komkommer-sound', true);
  els.auto.checked = opslagLezen('komkommer-auto', false);
  // Op een iPhone (elke browser daar is Safari onder de motorkap) legt iOS de pagina
  // op de achtergrond stil; dat zeggen we er bovenaan eerlijk bij.
  const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (IOS && !opslagLezen('komkommer-iosmelding-weg', false)) $('iosmelding').hidden = false;
  $('iosmelding-sluit').addEventListener('click', () => {
    $('iosmelding').hidden = true;
    opslagSchrijven('komkommer-iosmelding-weg', true);
  });

  bouwKomkommer();
  zetKomkommer(0);
  herstel();

  function herstel() {
    const stand = opslagLezen('komkommer-stand', null);
    const vers = stand && DUUR[stand.fase] && !(stand.eindtijd && Date.now() - stand.eindtijd > 3600e3);
    if (!vers) return zetFase('werk', false);
    if (stand.fase === 'pauze') {
      gesneden = Math.min(KK.n, Math.max(0, stand.pauzeStart | 0));
      zetKomkommer(gesneden);
    }
    zetFase(stand.fase, false);
    resterend = Math.min(DUUR[fase], Math.max(0, Number(stand.resterend) || DUUR[fase]));
    if (stand.eindtijd) {
      eindtijd = stand.eindtijd;
      loopAan();
      tik();
    } else {
      knop(resterend < DUUR[fase] ? 'Verder' : 'Start');
      teken();
    }
    bewaar();
  }
</script>
</body>
</html>
